# TokenForge installs two independent rows:
#   1. tokenforge-read-guard — global, active for every Session in the profile;
#      compresses oversized `read` results before they reach the model.
#   2. preset-tokenforge — opt-in agent preset for the full PTC tool surface.
- insert:
    - id: tokenforge-read-guard
      name: 'dsh-tokenforge/read-guard'
      config:
        enabled: true
        thresholdChars: 500000

    - id: preset-tokenforge
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: tokenforge
        name: TokenForge
        description: Token-efficient coding preset with PTC batch orchestration, compact file tools, and tool-output governance.
        order: 3
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding agent powered by the {{model}} model.
                You are running in TokenForge mode: work in batches, keep bulk data out of
                the conversation, and return only decisions, evidence and diffs.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 32768

          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          - - id: tokenforge-tools
  name: 'dsh-tokenforge/tools'
  config:
    governor:
      thresholdChars: 5000
      tools: ['tf_read', 'tf_grep', 'tf_glob', 'pwsh', 'web_fetch', 'web_search']
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: false
              readImage: false

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: ptc

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 5000
